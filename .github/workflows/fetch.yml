name: 提取纯净 Opera 直连节点

on:
  workflow_dispatch:
  schedule:
    # Opera 凭证会老化，建议每 4-6 小时跑一次确保凭据常新
    - cron: '0 */6 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装基础依赖
        run: |
          pip install pyyaml
          VER=$(curl -sL https://api.github.com/repos/snawoot-proxies-forks/opera-proxy/releases/latest | jq -r '.tag_name')
          curl -sL -o opera-proxy "https://github.com/snawoot-proxies-forks/opera-proxy/releases/download/${VER}/opera-proxy.linux-amd64"
          chmod +x opera-proxy

      - name: 生成节点配置
        run: python3 scripts/fetch_all.py configs

      - name: 提交并推送到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/free-nodes.yaml
          git diff --staged --quiet || (git commit -m "自动更新: Opera直连节点池 ($(date -u '+%F %T') UTC)" && git push)
