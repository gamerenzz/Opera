name: 提取纯直连节点池

on:
  workflow_dispatch:
  schedule:
    # 每天 UTC 03:00 (北京时间 11:00) 自动运行一次，刷新临时账号与证书
    - cron: '0 3 * * *'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖与辅助工具
        run: |
          set -euo pipefail
          
          # 1. 安装基础 Python 库和 Proton 官方支持库
          pip install pyyaml cryptography "git+https://github.com/ProtonVPN/python-proton-core.git"

          # 2. 下载 Opera 官方代理提取辅助工具
          VER=$(curl -sL https://api.github.com/repos/snawoot-proxies-forks/opera-proxy/releases/latest | jq -r '.tag_name')
          curl -sL -o opera-proxy "https://github.com/snawoot-proxies-forks/opera-proxy/releases/download/${VER}/opera-proxy.linux-amd64"
          chmod +x opera-proxy

          # 3. 下载 Psiphon (赛风) 官方核心客户端
          PSI_TAG=$(curl -sL https://api.github.com/repos/Psiphon-Labs/psiphon-tunnel-core/releases/latest | jq -r '.tag_name')
          echo "Psiphon 最新版本: $PSI_TAG"
          curl -sL -o psiphon.tar.gz "https://github.com/Psiphon-Labs/psiphon-tunnel-core/releases/download/${PSI_TAG}/psiphon-tunnel-core-linux-x86_64.tar.gz"
          tar -xzf psiphon.tar.gz
          
          # 重命名并赋予可执行权限，方便脚本识别调用
          mv psiphon-tunnel-core* psiphon-tunnel-core-x86_64 || true
          chmod +x psiphon-tunnel-core-x86_64

      - name: 运行节点聚合脚本
        env:
          PROTON_USER: ${{ secrets.PROTON_USER }}
          PROTON_PASS: ${{ secrets.PROTON_PASS }}
        run: |
          python3 scripts/fetch_all.py configs

      - name: 提交并推送到仓库
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add configs/free-nodes.yaml
          git diff --staged --quiet || (git commit -m "自动更新：直连节点池 ($(date -u '+%F %T') UTC)" && git push)

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: free-nodes
          path: configs/free-nodes.yaml
          retention-days: 7
